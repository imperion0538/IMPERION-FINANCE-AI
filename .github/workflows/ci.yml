
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Run one CI workflow per branch at a time.
# Do not cancel an already running verification.
concurrency:
  group: imperion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }} / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        group:
          - core-runtime
          - risk-gates-price-action
          - research-risk-reports
          - safety-integrations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Release metadata
        run: python scripts/release_check.py

      - name: Compile
        run: python -m compileall -q imperion scripts

      - name: Select test shard
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          case "$TEST_GROUP" in
            core-runtime)
              echo 'TEST_FILES=tests/test_core.py tests/test_engine.py tests/test_exchange_data.py tests/test_execution_live.py tests/test_learning.py' >> "$GITHUB_ENV"
              ;;
            risk-gates-price-action)
              echo 'TEST_FILES=tests/test_liquidation.py tests/test_live_gate.py tests/test_priceaction.py tests/test_radar.py tests/test_unified_features.py tests/test_v16_intelligence.py tests/test_v161_guards.py' >> "$GITHUB_ENV"
              ;;
            research-risk-reports)
              echo 'TEST_FILES=tests/test_reports.py tests/test_research_cli.py tests/test_risk.py' >> "$GITHUB_ENV"
              ;;
            safety-integrations)
              echo 'TEST_FILES=tests/test_safety_regressions.py tests/test_selftest.py tests/test_telegram.py tests/test_util_filters.py tests/test_webhook_http.py' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown test group: $TEST_GROUP"
              exit 2
              ;;
          esac

      - name: Run pytest shard
        run: |
          mkdir -p test-results
          python -m pytest \
            -o addopts="" \
            -q $TEST_FILES \
            --junitxml=test-results/junit-${{ matrix.python-version }}-${{ matrix.group }}.xml

      - name: Execution safety selftest
        run: python -m imperion selftest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}-${{ matrix.group }}
          path: test-results/*.xml
          if-no-files-found: ignore

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    name: Docker build, healthcheck, non-root, clean stop
    runs-on: ubuntu-latest
    needs:
      - tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t imperion-finance:ci .

      - name: Execution safety selftest in container
        run: |
          docker run --rm \
            --entrypoint python \
            imperion-finance:ci \
            -m imperion selftest

      - name: Verify entrypoint and healthcheck
        run: |
          docker image inspect imperion-finance:ci \
            --format '{{json .Config.Entrypoint}}' \
            | grep -q docker-entrypoint.sh

          test "$(docker image inspect imperion-finance:ci \
            --format '{{json .Config.Healthcheck}}')" != "null"

      - name: Verify health endpoint and clean shutdown
        run: |
          docker run -d \
            --name imp \
            -p 8080:8080 \
            -e MODE=dry \
            -e RADAR_COUNT=0 \
            -e SYMBOLS=BTCUSDT \
            -e ACTIVE_STYLES=day \
            imperion-finance:ci

          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/health \
            | grep -q '"version"'

          start=$(date +%s)

          docker stop -t 15 imp

          took=$(( $(date +%s) - start ))

          code=$(docker inspect imp \
            --format '{{.State.ExitCode}}')

          docker logs imp | tail -20

          echo "stop took ${took}s, exit code ${code}"

          test "$code" = "0"
          test "$took" -lt 15
