
name: release

# A release is published only when EVERY gate passes:
#   1. tag == VERSION and release metadata are consistent
#   2. full CI (3 Python versions, selftest, security audit, Docker build/healthcheck/clean stop)
#   3. Binance Futures Demo validation INCLUDING the order lifecycle, One-way mode and the exchange liquidation check,
#      producing HMAC-signed evidence (.github/workflows/testnet.yml); publish re-verifies it and attaches it
#   4. manual approval on the protected environment "production"
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(cat VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $v"; exit 1
          fi
      - run: python scripts/release_check.py

  ci:
    needs: [version]
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  testnet:
    needs: [version]
    uses: ./.github/workflows/testnet.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [version, ci, testnet]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: testnet-evidence
          path: evidence
      - name: Re-verify the signed testnet evidence of this run
        env:
          MODE: testnet
          TESTNET_EVIDENCE_SECRET: ${{ secrets.TESTNET_EVIDENCE_SECRET }}
        run: python -m imperion verify-evidence evidence/testnet-evidence.json --expect-sha256 "${{ needs.testnet.outputs.evidence_sha256 }}"
      - name: Build release archive
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix="imperion-finance-v$v/" -o "dist/imperion-finance-v$v.zip" HEAD
          (cd dist && sha256sum "imperion-finance-v$v.zip" > "imperion-finance-v$v.zip.sha256")
          cp evidence/testnet-evidence.json "dist/testnet-evidence-v$v.json"
          (cd dist && sha256sum "testnet-evidence-v$v.json" > "testnet-evidence-v$v.json.sha256")
          awk -v v="$v" '$0 ~ "^## "v {p=1; next} /^## / && p {exit} p' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          printf '\n### Testnet evidence\nSigned evidence SHA-256 (live approvals bind to it): `%s`\n' "${{ needs.testnet.outputs.evidence_sha256 }}" >> dist/notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"
          gh release create "v$v" dist/*.zip dist/*.json dist/*.sha256 --title "IMPERION FINANCE v$v" --notes-file dist/notes.md --verify-tag

  publish-image:
    name: Publish Docker image to GitHub Container Registry
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=17.0.0
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
