
name: Extract IMPERION V17 ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "IMPERION-FINANCE-V17.0.0-UNIFIED-INSTITUTIONAL.zip"

permissions:
  contents: write

concurrency:
  group: imperion-v17-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract IMPERION V17
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          import shutil
          import stat
          from pathlib import Path, PurePosixPath

          archive = Path(
              "IMPERION-FINANCE-V17.0.0-UNIFIED-INSTITUTIONAL.zip"
          )

          if not archive.is_file():
              raise SystemExit("V17 ZIP dosyasi bulunamadi.")

          root = Path.cwd().resolve()
          extracted = 0
          skipped = []

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = PurePosixPath(item.filename)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or ".git" in path.parts
                  ):
                      raise SystemExit(
                          f"Guvenli olmayan dosya: {item.filename}"
                      )

                  if path.parts[:2] == (".github", "workflows"):
                      skipped.append(item.filename)
                      continue

                  if item.is_dir():
                      continue

                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"Sembolik baglanti reddedildi: {item.filename}"
                      )

                  target = (root / Path(*path.parts)).resolve()

                  if not target.is_relative_to(root):
                      raise SystemExit(
                          f"Gecersiz hedef: {item.filename}"
                      )

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with z.open(item) as source:
                      with target.open("wb") as output:
                          shutil.copyfileobj(source, output)

                  extracted += 1

          print(f"V17 kaynak dosyalari acildi: {extracted}")
          print(f"Atlanan workflow dosyalari: {len(skipped)}")

          for name in skipped:
              print(f"Atlandi: {name}")

          print("IMPERION FINANCE AI V17 hazir.")
          PY

      - name: Commit extracted V17 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "Yeni dosya bulunamadi."
            exit 0
          fi

          git commit -m "Extract IMPERION FINANCE AI V17 source"

          git push origin HEAD:main

          echo "V17 kaynak kodlari GitHub'a yuklendi."
